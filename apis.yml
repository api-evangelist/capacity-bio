name: Capacity Bio
description: 'Capacity Bio is a clinical-stage biotechnology company developing mitophagy therapeutics
  to restore mitochondrial quality control in age- and disease-related conditions. Its platform advances
  small molecules, peptides, and nanoparticles that enhance identification and clearance of dysfunctional
  mitochondria. With operations in Los Angeles and Tokyo, the company closed a $35M financing round in
  2023 and is backed by Insight Partners. As a drug-development firm, Capacity Bio publishes no public
  API, developer platform, or SDK surface; this profile is maintained in the API Evangelist network as
  a company record.'
